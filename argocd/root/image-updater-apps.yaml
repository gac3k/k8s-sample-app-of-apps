# Image promotion for Argo CD Applications (v1.x CR API — not annotation-based).
# Ref: https://argocd-image-updater.readthedocs.io/en/stable/configuration/applications/
#
# The controller only considers Applications in the same namespace as this CR (argocd).
# Add one applicationRefs entry per app under helm/.../apps/<name>/ (namePattern matches
# the Application name: <name>-apps-<cluster>).
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: apps-gitops-images
  namespace: argocd
  annotations:
    # After ExternalSecret + argocd-image-updater CRDs.
    argocd.argoproj.io/sync-wave: "16"
spec:
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: "regexp:^\\d+\\.\\d+\\.\\d+$"
  # Git write-back: commits Helm values under each Application's chart path.
  # Credentials: Secret named below must exist in this namespace (ExternalSecret
  # in helm/.../argocd-image-updater; key sshPrivateKey).
  # Ref: https://argocd-image-updater.readthedocs.io/en/stable/basics/update-methods/
  writeBackConfig:
    method: "git:secret:argocd/argocd-image-updater-git-ssh"
    gitConfig:
      # Application sources use HTTPS; SSH URL here so write-back pushes with the deploy key.
      repository: git@github.com:gac3k/k8s-sample-app-of-apps.git
      branch: main
      writeBackTarget: helmvalues:values.yaml
  applicationRefs:
    - namePattern: sample-app-apps-in-cluster
      images:
        - alias: app
          imageName: ghcr.io/gac3k/k8s-sample-app:latest
          manifestTargets:
            helm:
              name: service.image.repository
              tag: service.image.tag
