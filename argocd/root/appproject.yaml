apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform applications managed by Argo CD
  sourceRepos:
    - https://github.com/gac3k/*
    # argocd-image-updater needs to read tag info from ghcr.io; the image-updater
    # registry is not a Git source so it is not listed here.
    # Public Helm repos used as chart dependencies must be allow-listed too:
    - https://argoproj.github.io/argo-helm
    - https://helm.releases.hashicorp.com
    - https://charts.external-secrets.io
    - https://releases.rancher.com/server-charts/latest
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

