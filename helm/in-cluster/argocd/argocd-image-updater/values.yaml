argocd-image-updater:
  # Image-updater is deployed in the same `argocd` namespace as argocd-server,
  # so the upstream defaults (auto-discovery of argocd-server, gRPC, in-cluster
  # service) work without overrides. If you ever move it elsewhere, pass the
  # connection flags via `extraArgs`, e.g.:
  #
  # extraArgs:
  #   - --argocd-server-addr
  #   - argocd-server.argocd.svc.cluster.local:443
  #   - --argocd-grpc-web

  config:
    log.level: info

    # GHCR is supported by image-updater out of the box, but registering it
    # explicitly lets us document the source and (later) wire in credentials
    # for private packages.
    registries:
      - name: GitHub Container Registry
        api_url: https://ghcr.io
        prefix: ghcr.io
        ping: true
        default: false
        insecure: false

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  metrics:
    enabled: false

  serviceAccount:
    create: true

# Umbrella-only: ImageUpdater CR (same Helm release as CRDs). Per-workload config is
# imageUpdaterGitOps.applications: a map (key = arbitrary slug, stable sort when rendering).
imageUpdaterGitOps:
  enabled: true
  name: apps-gitops-images
  syncWave: "16"
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: 'regexp:^\d+\.\d+\.\d+$'
  git:
    repository: git@github.com:gac3k/k8s-sample-app-of-apps.git
    branch: main
    writeBackTarget: helmvalues:values.yaml
  applications:
    # Map key = arbitrary slug (sortAlpha(keys) -> stable Helm output). Set enabled: false to skip.
    sample-app:
      namePattern: sample-app-apps-in-cluster
      images:
        - alias: app
          imageName: ghcr.io/gac3k/k8s-sample-app:latest
          manifestTargets:
            helm:
              name: service.image.repository
              tag: service.image.tag

# Umbrella-only: Secret for Git write-back; secretName must match writeBackConfig in ImageUpdater (templated).
gitWriteBackExternalSecret:
  enabled: true
  name: argocd-image-updater-git-writeback
  secretName: argocd-image-updater-git-ssh
  refreshInterval: 15m
  clusterSecretStore: vault-backend
  syncWave: "11"
  vault:
    path: secret/data/argocd/credentials
    property: privateKey
