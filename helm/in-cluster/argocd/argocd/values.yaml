argo-cd:
  global:
    # Used as default Ingress host for the Argo CD server chart template.
    domain: argocd.localhost

  applicationSet:
    enabled: true

  configs:
    # Matches HTTP access via Ingress (Traefik terminates; server runs insecure inside the cluster).
    cm:
      url: http://argocd.localhost
      # Repo-server revision cache; keep <= ApplicationSet git poll so new commits show up quickly.
      # Ref: Git generator + cache note in Applicationset Generators-Git docs.
      timeout.reconciliation: 60s
      timeout.reconciliation.jitter: 15s
    params:
      server.insecure: "true"
      # Default git-generator poll interval when an ApplicationSet omits requeueAfterSeconds.
      applicationsetcontroller.requeue.after: 1m
    # Public Git clone is HTTPS; see ApplicationSet / root Application repoURL.
    # Git push for image promotion uses a separate Secret (Vault → sshPrivateKey only),
    # not an Argo CD repository credential.

  server:
    ingress:
      enabled: true
      controller: generic
      ingressClassName: traefik
      hostname: argocd.localhost
      path: /
      pathType: Prefix
      tls: false
