argo-cd:
  applicationSet:
    enabled: true

  configs:
    # The source-of-truth repo is public so no credentials are required.
    # We still register it here for visibility in the Argo CD UI.
    repositories:
      k8s-sample-app-of-apps:
        url: https://github.com/gac3k/k8s-sample-app-of-apps.git
        type: git
