{{- if .Values.rancherBootstrapExternalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.rancherBootstrapExternalSecret.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.rancherBootstrapExternalSecret.syncWave | quote }}
spec:
  refreshInterval: {{ .Values.rancherBootstrapExternalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.rancherBootstrapExternalSecret.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.rancherBootstrapExternalSecret.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.rancherBootstrapExternalSecret.secretKey }}
      remoteRef:
        key: {{ .Values.rancherBootstrapExternalSecret.vault.path }}
        property: {{ .Values.rancherBootstrapExternalSecret.vault.property }}
{{- end }}
